<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اردو پشتو لغت</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Naskh Arabic','Jameel Noori Nastaleeq',serif;background:#f4f6f8;color:#222;min-height:100vh}
header{background:#1a4538;color:#fff;padding:18px 16px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:1.5rem;color:#f0d878}
header p{font-size:.85rem;color:#cfe0d8;margin-top:2px}
.searchbox{padding:14px 16px;background:#fff;position:sticky;top:0;z-index:9}
.searchbox input{width:100%;padding:12px 16px;font-size:1.05rem;border:2px solid #1a4538;border-radius:10px;font-family:inherit;direction:rtl}
.searchbox input:focus{outline:none;border-color:#f0d878}
.count{text-align:center;color:#666;font-size:.85rem;padding:8px}
#results{padding:0 16px 40px;max-width:800px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:12px 16px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card .ur{font-weight:700;font-size:1.2rem;color:#1a4538}
.card .ps{font-size:1rem;color:#454a52;margin-top:4px;line-height:1.7}
.card .copy{float:left;background:#eef2f5;border:none;border-radius:6px;padding:4px 10px;font-size:.8rem;cursor:pointer;font-family:inherit}
.card .copy:active{background:#dfe7ec}
.empty{text-align:center;color:#999;padding:40px 20px}
.home{display:block;text-align:center;margin:14px;color:#1a4538}
</style>
</head>
<body>
<header>
<h1>اردو پشتو لغت</h1>
<p>صرف اردو اور پشتو — کوئی انگریزی، کوئی فارسی نہیں</p>
</header>
<div class="searchbox">
<input id="q" type="text" placeholder="اردو یا پشتو لفظ لکھیں…" autocomplete="off">
</div>
<div class="count" id="count"></div>
<div id="results"></div>
<a class="home" href="index.html">← واپس ہوم پیج</a>
<script src="js/ur_ps_data.js"></script>
<script>
const DATA = (typeof UR_PS_DATA !== 'undefined') ? UR_PS_DATA : [];
const q = document.getElementById('q'), res = document.getElementById('results'), cnt = document.getElementById('count');
function norm(s){return s.replace(/[\u064B-\u0652\u0670]/g,'');}
function search(){
  const t = norm(q.value.trim());
  res.innerHTML = '';
  if(!t){ cnt.textContent = 'کُل الفاظ: ' + DATA.length.toLocaleString('ur'); showFirst(); return; }
  let n = 0;
  const out = [];
  for(const e of DATA){
    if(n >= 60) break;
    if(norm(e.u).includes(t) || norm(e.ps).includes(t)){
      out.push(`<div class="card"><button class="copy" onclick="copyT(this)">کاپی</button><div class="ur">${e.u}</div><div class="ps">${e.ps}</div></div>`);
      n++;
    }
  }
  res.innerHTML = out.join('') || '<div class="empty">کوئی نتیجہ نہیں ملا</div>';
  cnt.textContent = n + ' نتائج';
}
function showFirst(){
  res.innerHTML = DATA.slice(0,30).map(e=>`<div class="card"><button class="copy" onclick="copyT(this)">کاپی</button><div class="ur">${e.u}</div><div class="ps">${e.ps}</div></div>`).join('');
}
function copyT(btn){
  const card = btn.parentElement;
  const txt = card.querySelector('.ur').textContent + ' — ' + card.querySelector('.ps').textContent;
  navigator.clipboard.writeText(txt).then(()=>{ btn.textContent='کاپی ہو گیا'; setTimeout(()=>btn.textContent='کاپی',1500); });
}
q.addEventListener('input', search);
cnt.textContent = 'کُل الفاظ: ' + DATA.length.toLocaleString('ur');
showFirst();
</script>
</body>
</html>
